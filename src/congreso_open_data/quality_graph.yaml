version: 1
name: congreso-open-data-extraction-contracts

# These contracts describe literal extraction methods shipped by this package.
# Lake-specific quality gates and Silver/Gold publication policy remain in
# cpl-data-foundry and are deliberately not duplicated here.
models:
  pdf_text_layer:
    implementation: pypdf
    purpose: Extract embedded PDF text before an explicitly selected OCR backend.
    requires_gpu: false
  document_ocr:
    implementation: rapidocr_onnxruntime
    pipeline_version: rapidocr_onnxruntime_layout_v4_mixed_skew_rule_upright
    use_angle_classifier: false
    purpose: Recover literal text from scanned official documents.
    requires_gpu: true
    onnx_providers:
      - CUDAExecutionProvider
  deputy_document_table_detector:
    implementation: text_layout_heuristic
    purpose: Preserve tabular evidence from declaration pages.
    requires_gpu: false
  deputy_document_entity_regex:
    implementation: regex_entities_v1
    purpose: Extract literal amounts, dates, percentages and document entities.
    requires_gpu: false
  deputy_document_rules:
    implementation: rules_v1
    purpose: Produce reviewable patrimonial, income, liability and interest candidates.
    requires_gpu: false
